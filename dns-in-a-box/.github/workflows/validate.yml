name: DNS request validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate DNS request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate policy and print proposed before and after states
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          python3 -m unittest discover -s tests
          python3 -m dnsgitops.workflow check "$BASE_SHA" "$MERGE_SHA"
