name: Deploy approved BlueCat DNS request
on:
  push:
    branches: [main]
    paths: ['requests/**']
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && !github.event.forced && !github.event.deleted
    environment: dns-apply
    runs-on:
      group: bluecat-dns
      labels: bluecat-dns-singleton
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Refresh protected branch and apply the approved change
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          DNS_STATE_DIR: ${{ vars.DNS_STATE_DIR }}
          BAM_URL: ${{ vars.BAM_URL }}
          BAM_CA_FILE: ${{ vars.BAM_CA_FILE }}
          BAM_USER: ${{ secrets.BAM_USER }}
          BAM_PASSWORD: ${{ secrets.BAM_PASSWORD }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          python3 -m dnsgitops.workflow deploy "$BASE_SHA" "$HEAD_SHA"
